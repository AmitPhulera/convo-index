[project]
name = "convo-index"
version = "0.3.0"
description = "Local index + browser for AI coding-assistant conversations (Claude Code, Opencode, Codex, Antigravity, pi)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec==0.1.9",
    "duckdb>=1.1.0",
    "fastembed>=0.7",
]

[project.scripts]
convo-index = "convo_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convo_index"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# pyflakes, the syntax/runtime-relevant pycodestyle rules and bugbear; the repo keeps
# its compact one-line statements, so the pure layout rules stay off
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E701", "E702", "E731", "E741"]
