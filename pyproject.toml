[project]
name = "convo-index"
version = "0.3.0"
description = "Local index + browser for AI coding-assistant conversations (Claude Code, Opencode, Codex, Antigravity)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec==0.1.6",
    "duckdb>=1.1.0",
    "fastembed>=0.7",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convo_index"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
