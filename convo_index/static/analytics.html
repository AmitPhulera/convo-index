<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · Conversation Index</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
      var h = document.documentElement;
      if (t === "light" || t === "dark") h.setAttribute("data-theme", t);
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches) h.classList.add("dark-auto");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h10M5 17h7"/></svg></span>
      <span>Conversation Index</span>
    </a>
    <nav class="tabs" aria-label="Pages"><a href="/">Search</a><a href="/analytics" class="active">Analytics</a></nav>
    <span class="spacer"></span>
    <button class="btn icon-only" id="theme" title="Toggle light / dark theme" aria-label="Toggle theme">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="analytics">
    <div class="analytics-inner">
      <div class="page-head">
        <h2>Analytics</h2>
        <span class="hint">Click a source, tag, ticket or project to open those conversations in Search.</span>
      </div>
      <div class="kpis" id="kpis"></div>

      <section class="panel" id="usage-panel">
        <h3>Tokens and cost <span class="hint" id="usage-note"></span></h3>
        <div class="tabs-row" role="tablist" id="usage-tabs">
          <button role="tab" aria-selected="true" data-tab="usage-by-model">By model</button>
          <button role="tab" aria-selected="false" data-tab="usage-by-source">By source</button>
          <button role="tab" aria-selected="false" data-tab="usage-by-month">By month</button>
          <button role="tab" aria-selected="false" data-tab="usage-by-project">By project</button>
          <button role="tab" aria-selected="false" data-tab="usage-by-reference">By ticket, PR, branch</button>
          <button role="tab" aria-selected="false" data-tab="usage-top">Top conversations</button>
        </div>
        <div class="tab-panel active" id="usage-by-model"></div>
        <div class="tab-panel" id="usage-by-source"></div>
        <div class="tab-panel" id="usage-by-month"></div>
        <div class="tab-panel" id="usage-by-project"></div>
        <div class="tab-panel" id="usage-by-reference"></div>
        <div class="tab-panel" id="usage-top"></div>
        <div id="usage-unpriced"></div>
      </section>

      <div class="grid-2">
        <section class="panel"><h3>Conversations per month</h3><div id="by-month"></div></section>
        <section class="panel"><h3>By source</h3><div id="by-source"></div></section>
        <div id="by-tags" style="display: contents"></div>
        <section class="panel"><h3>Top tickets</h3><div id="top-tickets"></div></section>
        <section class="panel"><h3>Top PRs, issues and branches</h3><div id="top-references"></div></section>
        <section class="panel wide"><h3>Top projects</h3><div id="top-projects"></div></section>
      </div>
    </div>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/common.js"></script>
  <script src="/static/analytics.js"></script>
</body>
</html>
