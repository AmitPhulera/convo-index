<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Index</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Apply the remembered theme before the first paint (no flash). "auto" follows the OS.
    (function () {
      var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
      var h = document.documentElement;
      if (t === "light" || t === "dark") h.setAttribute("data-theme", t);
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches) h.classList.add("dark-auto");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h10M5 17h7"/></svg></span>
      <span>Conversation Index</span>
    </a>
    <nav class="tabs" aria-label="Pages"><a href="/" class="active">Search</a></nav>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="btn" id="refresh" title="Re-read every source and index new or changed conversations">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg><span class="label">Refresh index</span>
    </button>
    <button class="btn icon-only" id="theme" title="Toggle light / dark theme" aria-label="Toggle theme">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="searchbar" aria-label="Search and filters">
    <div class="search-row">
      <label class="search-box" id="search-box">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search conversations, tickets, code, error messages…" autocomplete="off" autofocus>
        <kbd title="Press / to focus the search box">/</kbd>
        <button class="clear" id="q-clear" type="button" aria-label="Clear search"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
      <div class="segmented" id="mode" role="group" aria-label="Search mode">
        <button type="button" data-mode="hybrid" aria-pressed="true" title="Keyword and meaning combined">Hybrid</button>
        <button type="button" data-mode="keyword" aria-pressed="false" title="Exact words and phrases">Keyword</button>
        <button type="button" data-mode="semantic" aria-pressed="false" title="Similar meaning, even with different words">Semantic</button>
      </div>
    </div>
    <div class="filters" id="filters">
      <span id="source-filters" class="chip-group" aria-label="Sources"></span>
      <span id="tag-filters" class="chip-group" aria-label="Tags"></span>
      <span class="chip-group" aria-label="Options">
        <span class="chip-group-label">Show</span>
        <label class="chip" title="Only conversations that mention a ticket"><input type="checkbox" id="f-ticket"> Has ticket</label>
        <label class="chip" title="Include conversations you hid"><input type="checkbox" id="f-hidden"> Hidden</label>
        <label class="chip" title="Include sub-agent sessions spawned by another conversation"><input type="checkbox" id="f-children"> Sub-sessions</label>
      </span>
      <button class="btn ghost clear-filters" id="clear-filters" type="button">Clear filters</button>
    </div>
  </section>

  <main class="layout">
    <section id="list-pane" aria-label="Results">
      <div class="results-head"><span class="count" id="results-count"></span><span class="hint" id="results-hint"></span></div>
      <ul id="results"></ul>
    </section>
    <section id="detail-pane" aria-label="Conversation">
      <div id="detail" class="empty">
        <div class="empty-state">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-6.5A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 15h5"/></svg>
          <h4>Pick a conversation</h4>
          <p>Use <kbd>↑</kbd><kbd>↓</kbd> or <kbd>j</kbd><kbd>k</kbd> to move, <kbd>Enter</kbd> to open, <kbd>Esc</kbd> to close.</p>
        </div>
      </div>
    </section>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/common.js"></script>
</body>
</html>
