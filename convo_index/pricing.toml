"claude-mythos-5"    = { input = 10.0, output = 50.0, cache_read = 1.00, cache_write = 12.50, cache_write_1h = 20.00 }
# Opus 5.5 (added 2026-10-31): cache reads are 0.05x input, not the usual 0.1x; no long-context tier.
