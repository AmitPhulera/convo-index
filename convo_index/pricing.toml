# Seed pricing for cost *estimates* (docs/design.md §10). USD per million tokens, list prices from the
# vendors' public pricing pages on the date in `revision`. Exact model id or an explicit alias
# only; anything else is "unpriced" and shows up in `convo-index doctor`.
#
# Override or extend in ~/.config/convo-index/pricing.toml (same layout; user entries win).
# Buckets: input (uncached), cache_read, cache_write (5-minute write), cache_write_1h (1-hour
# write; Anthropic bills it at 2x input — Claude Code uses it heavily), output. Reasoning tokens
# are already inside `output` for every source indexed here and are not priced separately.
# A missing cache_read/cache_write falls back to the input rate; a missing cache_write_1h to
# cache_write.
#
# Every number here is an API-equivalent estimate; subscription plans are not billed this way.
revision = "2026-09-16"
sources = ["https://platform.claude.com/docs/en/about-claude/pricing",
           "https://developers.openai.com/api/docs/pricing",
           "https://ai.google.dev/gemini-api/docs/pricing"]

# Providers whose models run locally: every model is priced at 0 and counts as priced.
zero_cost_providers = ["ollama", "lmstudio", "llamacpp", "local"]

[models]
# Anthropic (cache_write = 5-minute write; the 1-hour write is 2x input)
"claude-fable-5-1"   = { input = 10.0, output = 50.0, cache_read = 0.25, cache_write = 12.50, cache_write_1h = 20.00 }
"claude-mythos-5-1"  = { input = 10.0, output = 50.0, cache_read = 0.25, cache_write = 12.50, cache_write_1h = 20.00 }
